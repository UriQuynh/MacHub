[workspace]
resolver = "2"
members = ["crates/machub-core", "crates/machub-agent-hook", "src-tauri"]

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "GPL-3.0-only"
authors = ["MacHub contributors"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
panic = "abort"
