name: Build & Release MacHub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v0.1.0) — phải khớp file VERSION'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (Apple Silicon)
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Make Build Script Executable
        run: chmod +x build.sh

      # Ký bằng cùng chứng chỉ self-signed với bản local để Designated Requirement
      # (identifier + certificate root) không đổi giữa các phiên bản → TCC giữ quyền.
      # Bản phát hành BẮT BUỘC ký bằng chứng chỉ này: Sparkle từ chối cài bản cập nhật
      # có chữ ký code khác bản đang chạy, nên ký ad-hoc sẽ làm hỏng chuỗi cập nhật.
      - name: Import Code Signing Certificate
        id: signing
        env:
          SIGNING_P12_BASE64: ${{ secrets.MACHUB_SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.MACHUB_SIGNING_P12_PASSWORD }}
        run: |
          set -uo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/machub-signing.keychain-db"

          fail() {
            echo "::error title=Signing certificate import failed::$1"
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 1
          }

          if [ -z "${SIGNING_P12_BASE64}" ]; then
            fail "Thiếu secret MACHUB_SIGNING_P12_BASE64 — không phát hành bản ký ad-hoc."
          fi
          if [ -z "${SIGNING_P12_PASSWORD}" ]; then
            fail "Thiếu secret MACHUB_SIGNING_P12_PASSWORD."
          fi

          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          if ! security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"; then
            fail "Không tạo được keychain tạm."
          fi
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" \
            || fail "Không unlock được keychain tạm."

          # BSD base64 trên runner macOS chỉ có -D; secret có thể lẫn xuống dòng/CRLF.
          CLEAN_B64="$(printf '%s' "$SIGNING_P12_BASE64" | tr -d '[:space:]')"
          echo "base64 sạch: ${#CLEAN_B64} ký tự"
          DECODE_ERR="$RUNNER_TEMP/decode.err"
          if ! printf '%s' "$CLEAN_B64" | python3 -c "import base64,sys;raw=''.join(sys.stdin.read().split());sys.stdout.buffer.write(base64.b64decode(raw,validate=True))" > "$RUNNER_TEMP/cert.p12" 2>"$DECODE_ERR"; then
            echo "python decode: $(tail -2 "$DECODE_ERR" | tr '\n' ' ')"
            if ! printf '%s' "$CLEAN_B64" | openssl base64 -d -A > "$RUNNER_TEMP/cert.p12" 2>>"$DECODE_ERR"; then
              fail "Secret base64 không giải mã được: $(tail -3 "$DECODE_ERR" | tr '\n' ' ')"
            fi
          fi
          echo "p12 size: $(wc -c < "$RUNNER_TEMP/cert.p12" | tr -d ' ') bytes"
          # Nếu nội dung không phải DER (0x30) thì có thể secret bị base64 2 lớp.
          ensure_der() {
            local f="$1" i
            for i in 1 2; do
              [ "$(head -c 1 "$f" | od -An -tx1 | tr -d ' \n')" = "30" ] && return 0
              python3 -c "import base64,sys;p=sys.argv[1];raw=''.join(open(p,'r',errors='ignore').read().split());open(p,'wb').write(base64.b64decode(raw,validate=True))" "$f" 2>/dev/null || return 1
            done
            [ "$(head -c 1 "$f" | od -An -tx1 | tr -d ' \n')" = "30" ]
          }

          ensure_der "$RUNNER_TEMP/cert.p12" || fail "Secret không phải p12 DER và cũng không decode thêm được (size $(wc -c < "$RUNNER_TEMP/cert.p12" | tr -d ' ') bytes)."
          if ! P12_INFO="$(openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -noout -passin "pass:${SIGNING_P12_PASSWORD}" 2>&1)"; then
            fail "Không đọc được p12 (size $(wc -c < "$RUNNER_TEMP/cert.p12" | tr -d ' ') bytes, sha256 $(shasum -a 256 "$RUNNER_TEMP/cert.p12" | cut -d' ' -f1)): $(echo "$P12_INFO" | tail -2 | tr '\n' ' ')"
          fi

          if ! IMPORT_OUT="$(security import "$RUNNER_TEMP/cert.p12" \
                -P "$SIGNING_P12_PASSWORD" \
                -A -t cert -f pkcs12 \
                -k "$KEYCHAIN_PATH" 2>&1)"; then
            fail "security import thất bại: $(echo "$IMPORT_OUT" | tail -3 | tr '\n' ' ')"
          fi
          echo "$IMPORT_OUT"

          if ! PART_OUT="$(security set-key-partition-list \
                -S apple-tool:,apple:,codesign: \
                -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" 2>&1)"; then
            fail "set-key-partition-list thất bại: $(echo "$PART_OUT" | tail -3 | tr '\n' ' ')"
          fi
          rm -f "$RUNNER_TEMP/cert.p12"

          # codesign chỉ tìm identity trong các keychain thuộc search list.
          # Runner là máy dùng một lần nên không cần khôi phục lại danh sách.
          ORIGINAL_KEYCHAINS=()
          while IFS= read -r kc; do
            [ -n "$kc" ] && ORIGINAL_KEYCHAINS+=("$kc")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*//; s/"//g')
          if ! security list-keychains -d user -s "$KEYCHAIN_PATH" "${ORIGINAL_KEYCHAINS[@]}"; then
            fail "Không thêm được keychain tạm vào search list."
          fi
          echo "Keychains: $(security list-keychains -d user | tr -d '\n')"

          # -v chỉ liệt kê identity đã trust; cert tự ký trên runner là untrusted
          # nhưng codesign vẫn dùng được, nên phải bỏ -v.
          IDENTITIES="$(security find-identity -p codesigning "$KEYCHAIN_PATH" 2>&1)"
          echo "$IDENTITIES"
          case "$IDENTITIES" in
            *"MacHub Self-Signed"*)
              echo "✅ Đã import chứng chỉ MacHub Self-Signed"
              echo "signed=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              fail "Đã import nhưng không thấy identity 'MacHub Self-Signed'. Output: $(echo "$IDENTITIES" | tr '\n' ' ')"
              ;;
          esac

      - name: Validate Release Tag
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then TAG="$INPUT_TAG"; else TAG="$REF_NAME"; fi
          # Không nội suy trực tiếp input vào script (tránh script injection); kiểm tra định dạng.
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::Tag không hợp lệ: $TAG"; exit 1
          fi
          VERSION="$(tr -d '[:space:]' < VERSION)"
          BASE="${TAG#v}"; BASE="${BASE%%-*}"
          if [ "$BASE" != "$VERSION" ]; then
            echo "::error::Tag $TAG không khớp file VERSION ($VERSION)"; exit 1
          fi
          source config/release.env
          if [[ "$GITHUB_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::config/release.env GITHUB_REPO=$GITHUB_REPO khác repo đang chạy ($GITHUB_REPOSITORY)"; exit 1
          fi
          if grep -q '^__' config/sparkle_public_ed_key; then
            echo "::error::Chưa có khóa công khai Sparkle trong config/sparkle_public_ed_key"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Compile and Package MacHub Bundle
        run: ./build.sh --no-run
        env:
          CI: true
          MACHUB_SIGN_IDENTITY: MacHub Self-Signed
          MACHUB_SIGN_KEYCHAIN: ${{ runner.temp }}/machub-signing.keychain-db

      - name: Verify Code Signature
        run: |
          set -euo pipefail
          codesign --verify --deep --strict build/MacHub.app
          codesign -dv --verbose=4 build/MacHub.app 2>&1 | grep -F "Authority=MacHub Self-Signed"
          codesign -d -r- build/MacHub.app 2>&1 | tail -1
          echo "### Checksums" >> "$GITHUB_STEP_SUMMARY"
          shasum -a 256 build/MacHub.zip build/MacHub.app/Contents/Resources/smc | tee -a "$GITHUB_STEP_SUMMARY"

      # Ký file zip bằng khóa EdDSA riêng của Sparkle và tạo appcast.xml.
      # sign_update lấy từ artifact SwiftPM của Sparkle (SwiftPM đã kiểm checksum khi tải).
      - name: Sign Update & Generate Appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.MACHUB_SPARKLE_ED_PRIVATE_KEY }}
          TAG: ${{ steps.vars.outputs.tag }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_ED_PRIVATE_KEY}" ]; then
            echo "::error::Thiếu secret MACHUB_SPARKLE_ED_PRIVATE_KEY"; exit 1
          fi
          SIGN_UPDATE=".build/artifacts/sparkle/Sparkle/bin/sign_update"
          [ -x "$SIGN_UPDATE" ] || { echo "::error::Không tìm thấy $SIGN_UPDATE"; exit 1; }
          umask 077
          KEY_FILE="$RUNNER_TEMP/sparkle_ed.key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEY_FILE"
          SIG_ATTRS="$("$SIGN_UPDATE" --ed-key-file "$KEY_FILE" build/MacHub.zip)"
          rm -f "$KEY_FILE"
          case "$SIG_ATTRS" in
            *'sparkle:edSignature="'*'length="'*) ;;
            *) echo "::error::sign_update trả về kết quả lạ: $SIG_ATTRS"; exit 1 ;;
          esac
          REPO_URL="https://github.com/${GITHUB_REPOSITORY}"
          PUB_DATE="$(LC_ALL=C date -u '+%a, %d %b %Y %H:%M:%S +0000')"
          cat > build/appcast.xml <<XML
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">
            <channel>
              <title>MacHub</title>
              <link>${REPO_URL}</link>
              <item>
                <title>MacHub ${VERSION}</title>
                <pubDate>${PUB_DATE}</pubDate>
                <sparkle:version>${VERSION}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>
                <sparkle:releaseNotesLink>${REPO_URL}/releases/tag/${TAG}</sparkle:releaseNotesLink>
                <enclosure url="${REPO_URL}/releases/download/${TAG}/MacHub.zip" type="application/octet-stream" ${SIG_ATTRS} />
              </item>
            </channel>
          </rss>
          XML
          xmllint --noout build/appcast.xml
          cat build/appcast.xml

      # Tag có hậu tố (v0.2.0-rc1) → prerelease: không phải "latest", nên
      # releases/latest/download/appcast.xml vẫn trỏ về bản chính thức.
      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: MacHub ${{ steps.vars.outputs.tag }}
          files: |
            build/MacHub.zip
            build/MacHub.dmg
            build/appcast.xml
          draft: false
          prerelease: ${{ steps.vars.outputs.prerelease }}
          generate_release_notes: true

      - name: Cleanup Signing Keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/machub-signing.keychain-db" 2>/dev/null || true
