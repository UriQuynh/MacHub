name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Toolchain
        run: |
          sw_vers
          swift --version
          xcodebuild -version

      - name: Build (debug)
        run: swift build

      # Không dùng --parallel: với SwiftPM 6.1, `swift test --parallel` trả exit 0
      # dù test Swift Testing hỏng (đã gặp: 1 test fail nhưng bước vẫn xanh).
      - name: Unit tests
        run: swift test 2>&1 | tee test-output.txt

      - name: Build app bundle (ad-hoc, no release secrets)
        run: ./build.sh --no-run
        env:
          CI: true

      - name: E2E smoke test
        run: ./scripts/e2e-smoke.sh

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-${{ github.run_number }}
          path: |
            build/e2e/
            test-output.txt
          if-no-files-found: warn
