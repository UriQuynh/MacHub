name: Extension

on:
  push:
    branches: [main]
    paths: ["extensions/**", ".github/workflows/extension.yml"]
  pull_request:
    paths: ["extensions/**", ".github/workflows/extension.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extensions/responsive
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate manifest & JS syntax
        run: |
          python3 -c "import json; json.load(open('manifest.json'))"
          for f in *.js; do node --check "$f" 2>/dev/null || node --input-type=module --check < "$f"; done

      - name: Install Playwright Chromium
        run: |
          pip install playwright==1.49.0
          python -m playwright install --with-deps chromium

      - name: Extension E2E (Chromium)
        run: xvfb-run -a python tests/e2e_test.py

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: responsive-extension-${{ github.run_number }}
          path: extensions/responsive/tests/out/
          if-no-files-found: warn
